{{- if and .Values.daemonset.enabled .Values.kyvernoPolicyExceptions.enabled (.Capabilities.APIVersions.Has "policies.kyverno.io/v1/PolicyException") }}
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: {{ template "certExporter.daemonset.name" . }}-policy-exceptions
  namespace: {{ .Values.kyvernoPolicyExceptions.namespace | default .Release.Namespace }}
  labels:
    {{- include "certExporter.daemonset.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
spec:
  policyRefs:
  - name: disallow-host-path
    kind: ValidatingPolicy
  - name: restrict-volume-types
    kind: ValidatingPolicy
  - name: disallow-host-ports
    kind: ValidatingPolicy
  - name: disallow-host-namespaces
    kind: ValidatingPolicy
  - name: disallow-privilege-escalation
    kind: ValidatingPolicy
  - name: restrict-seccomp-strict
    kind: ValidatingPolicy
  - name: disallow-capabilities-strict
    kind: ValidatingPolicy
  # require-pod-probes is a supplemental policy and usually not enabled. It is
  # excepted because the cert-exporter DaemonSet fails it when the policy is
  # enforced.
  - name: require-pod-probes
    kind: ValidatingPolicy
  # restrict-sa-automount-sa-token is a supplemental policy and usually not
  # enabled. It is excepted because the cert-exporter DaemonSet ServiceAccount
  # fails it when the policy is enforced.
  - name: restrict-sa-automount-sa-token
    kind: ValidatingPolicy
  matchConditions:
  - name: cert-exporter-daemonset-workloads
    # ServiceAccount is matched for restrict-sa-automount-sa-token.
    expression: >-
      request.kind.kind in ['DaemonSet', 'ReplicaSet', 'Pod', 'ServiceAccount'] &&
      request.namespace == '{{ .Release.Namespace }}' &&
      has(object.metadata.name) &&
      (object.metadata.name == '{{ template "certExporter.daemonset.name" . }}' || object.metadata.name.startsWith('{{ template "certExporter.daemonset.name" . }}-'))
{{- end }}
